<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SpatialGraff</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        overflow: hidden;
        font-family: -apple-system, system-ui, sans-serif;
      }

      #app-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #start-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #fff;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      #start-screen h1 {
        font-size: 1.5rem;
        margin: 0;
        letter-spacing: 0.05em;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9);
      }

      #start-screen p {
        margin: 0;
        max-width: 320px;
        color: #ccc;
        font-size: 0.9rem;
        line-height: 1.4;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
      }

      #ar-button {
        padding: 14px 32px;
        font-size: 1rem;
        border-radius: 999px;
        border: none;
        background: #ff2d78;
        color: #fff;
        font-weight: 600;
        letter-spacing: 0.03em;
      }

      #ar-button:disabled {
        background: #444;
        color: #888;
      }

      #unsupported-note {
        color: #f66;
        font-size: 0.8rem;
        max-width: 320px;
      }

      /* dom-overlay content shown while an immersive-ar session is active */
      #xr-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        display: none;
      }

      #xr-overlay.active {
        display: block;
      }

      #xr-status {
        position: absolute;
        top: env(safe-area-inset-top, 12px);
        left: 0;
        right: 0;
        text-align: center;
        color: #fff;
        font-size: 0.8rem;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      }

      #xr-exit {
        position: absolute;
        bottom: env(safe-area-inset-bottom, 24px);
        left: 50%;
        transform: translateX(-50%);
        pointer-events: auto;
        padding: 10px 24px;
        border-radius: 999px;
        border: none;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <canvas id="app-canvas"></canvas>

    <div id="start-screen">
      <h1>SPATIALGRAFF</h1>
      <p>
        Markerless AR spray-paint. Point your phone at a wall or floor, pinch
        your free hand in front of the front camera to spray, or tap the
        screen if hand-tracking isn't available.
      </p>
      <button id="ar-button" disabled>Checking AR support&hellip;</button>
      <p id="unsupported-note" hidden></p>
    </div>

    <div id="xr-overlay">
      <div id="xr-status">Aim at a surface</div>
      <button id="xr-exit">Exit AR</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
